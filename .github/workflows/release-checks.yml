name: release checks
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q run_framework.py run_wholeframe_lrwide.py src spatial tests
      - run: python -m pytest -q tests/test_release_cpu.py
